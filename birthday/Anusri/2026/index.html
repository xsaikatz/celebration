<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday Anusri</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>

@font-face{font-family:'xArRay';src:url('https://XArCLexuZ/Brand/Font/xArRay/Regular.woff2') format('woff2'),url('fonts/primary.woff') format('woff'),url('fonts/primary.ttf') format('truetype');font-weight:400 900;font-style:normal;font-display:swap}
:root{
  --font-primary:'xArRay','Playfair Display';
  --font-secondary:'CustomSecondary','Poppins',sans-serif;
  --red:#ff0040;
  --blue:#0040ff;
  --black:#000;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--black);color:#fff;font-family:var(--font-secondary)}
.session{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;opacity:0;transition:opacity .8s ease;z-index:1}
.session.active{display:flex;opacity:1}
.session.fade-out{opacity:0}

.aurora-name{
  display:inline-block;
  background:linear-gradient(90deg,var(--red),var(--blue),var(--red),var(--blue),var(--red));
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:auroraMove 3s linear infinite;
  font-weight:700;
}
@keyframes auroraMove{0%{background-position:0% 50%}100%{background-position:200% 50%}}

#session-quotes{padding:40px 20px;overflow:hidden}
#session-quotes::before,#session-quotes::after{content:'';position:absolute;width:500px;height:500px;border-radius:50%;pointer-events:none}
#session-quotes::before{background:radial-gradient(circle,rgba(255,0,64,.07) 0%,transparent 70%);top:40%;left:20%;animation:pulseGlow 4s ease-in-out infinite alternate}
#session-quotes::after{background:radial-gradient(circle,rgba(0,64,255,.07) 0%,transparent 70%);top:40%;left:70%;animation:pulseGlow 4s ease-in-out infinite alternate-reverse}
@keyframes pulseGlow{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.2);opacity:1}}
.quote-text{font-family:var(--font-primary);font-size:clamp(24px,5vw,52px);font-weight:400;font-style:italic;text-align:center;max-width:900px;line-height:1.5;opacity:0;transition:opacity .7s ease;position:relative;z-index:2}
.quote-text.visible{opacity:1}

#session-name{padding:20px;gap:30px}
.name-question{font-family:var(--font-primary);font-size:clamp(18px,3.5vw,30px);text-align:center;max-width:600px;line-height:1.5;color:rgba(255,255,255,.9)}
.input-group{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:400px}
.name-input{
  width:100%;padding:14px 20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);
  border-radius:10px;color:#fff;font-size:16px;font-family:var(--font-secondary);outline:none;
  transition:border-color .3s,box-shadow .3s;text-align:center;
}
.name-input:focus{border-color:var(--red);box-shadow:0 0 20px rgba(255,0,64,.2)}
.name-input::placeholder{color:rgba(255,255,255,.3)}
.btn-continue{
  padding:14px 48px;background:linear-gradient(135deg,var(--red),#cc0033);color:#fff;border:none;
  border-radius:10px;font-size:16px;font-family:var(--font-secondary);font-weight:600;cursor:pointer;
  transition:all .3s;letter-spacing:.5px;
}
.btn-continue:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,0,64,.4)}
.btn-continue:active{transform:translateY(0)}
.name-error{color:var(--red);font-size:13px;opacity:0;transition:opacity .3s;height:18px}
.name-error.show{opacity:1}

#session-compare{padding:20px;gap:30px}
.compare-question{font-family:var(--font-primary);font-size:clamp(22px,4vw,36px);font-weight:700;text-align:center}
.compare-options{display:flex;flex-direction:column;gap:14px;width:100%;max-width:380px}
.compare-btn{
  padding:18px 28px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.85);border-radius:12px;font-size:clamp(15px,2.5vw,18px);font-family:var(--font-secondary);
  cursor:pointer;transition:all .3s;text-align:center;letter-spacing:.3px;
}
.compare-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,0,64,.4);transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.4);color:#fff}
.compare-btn:active{transform:translateY(-1px)}

#session-book{padding:0;overflow:hidden}
#book-canvas{position:absolute;inset:0;z-index:0}
#book-scene{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:100%;height:100%;transition:opacity .8s}
.book-wrapper{perspective:1200px;--bs:1}
.book{position:relative;width:380px;height:520px;transform-style:preserve-3d;transform:scale(var(--bs))}
.book-spine{position:absolute;left:0;top:0;width:16px;height:100%;z-index:5;border-radius:3px 0 0 3px}
.book-spine-hell{background:linear-gradient(180deg,#1a0000,#0d0000);border:1px solid #2a0000;border-right:none}
.book-spine-heaven{background:linear-gradient(180deg,#c9a800,#a88600);border:1px solid #dab800;border-right:none}
.book-back{position:absolute;inset:0;border-radius:4px}
.book-back-hell{background:linear-gradient(135deg,#0a0000,#150000);border:1px solid #200000}
.book-back-heaven{background:linear-gradient(135deg,#f5ecd0,#ede0b8);border:1px solid #d4c090}
.book-page{position:absolute;inset:0;z-index:2;border-radius:2px;overflow:hidden}
.book-page-hell{background:#111;color:#a00;font-family:var(--font-primary)}
.book-page-heaven{background:#fffef5;color:#6b4e00;font-family:var(--font-primary)}
.page-content{position:absolute;top:30px;left:35px;right:30px;bottom:30px;overflow:hidden}
.written-line{font-size:13px;line-height:26px;text-shadow:0 0 3px currentColor;white-space:pre-wrap;word-break:break-word}
.written-line.title-line{font-size:18px;font-weight:700;margin-bottom:4px}
.written-line.number-line{font-size:16px;font-weight:700}
.book-cover{position:absolute;inset:0;z-index:3;transform-origin:left center;transition:transform 1.6s cubic-bezier(.4,0,.2,1);backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;border-radius:4px}
.book-cover.open{transform:rotateY(-165deg)}
.book-cover-hell{background:linear-gradient(145deg,#1a0000 0%,#080000 50%,#1a0000 100%);border:2px solid #300000;box-shadow:0 0 40px rgba(255,0,0,.15),inset 0 0 60px rgba(0,0,0,.6)}
.book-cover-heaven{background:linear-gradient(145deg,#fffbe6 0%,#fff8d0 50%,#fffbe6 100%);border:2px solid #e6c800;box-shadow:0 0 50px rgba(255,215,0,.25),inset 0 0 40px rgba(255,255,255,.5)}
.cover-title{font-family:var(--font-primary);font-size:clamp(24px,4vw,32px);font-weight:900;text-align:center;padding:20px;opacity:0;transform:scale(.8);transition:all 1s ease;position:relative;z-index:2}
.cover-title.visible{opacity:1;transform:scale(1)}
.cover-title-hell{color:#8b0000;text-shadow:0 0 15px rgba(255,0,0,.6),0 0 30px rgba(255,0,0,.3),0 2px 4px rgba(0,0,0,.8);letter-spacing:2px}
.cover-title-heaven{color:#8b6914;text-shadow:0 0 15px rgba(255,215,0,.5),0 0 30px rgba(255,215,0,.2),0 1px 2px rgba(0,0,0,.1);letter-spacing:2px}
.blood-drip{position:absolute;top:48%;width:3px;height:0;background:linear-gradient(to bottom,#8b0000,#ff0000,transparent);border-radius:0 0 50% 50%;animation:bloodDrip 2.5s ease-in forwards;z-index:1}
@keyframes bloodDrip{0%{height:0;opacity:1}75%{height:40px;opacity:1}100%{height:45px;opacity:.4}}
.heaven-glow-ring{position:absolute;width:200px;height:200px;border:2px solid rgba(255,215,0,.2);border-radius:50%;animation:heavenRing 3s ease-in-out infinite}
@keyframes heavenRing{0%{transform:scale(.8);opacity:.2}50%{transform:scale(1.3);opacity:.5}100%{transform:scale(.8);opacity:.2}}

.pen{position:absolute;width:5px;height:65px;transform-origin:bottom center;transform:rotate(-5deg);transition:top .35s ease,left .08s linear;opacity:0;z-index:10}
.pen.visible{opacity:1}
.pen.writing{animation:penWobble .12s infinite alternate}
@keyframes penWobble{0%{transform:rotate(-6deg)}100%{transform:rotate(-3deg)}}
.pen-body{width:5px;height:50px;border-radius:2px 2px 0 0}
.pen-tip{width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;position:absolute;bottom:-8px;left:50%;transform:translateX(-50%)}
.pen-hell .pen-body{background:linear-gradient(180deg,#222,#0a0a0a)}
.pen-hell .pen-tip{border-top:10px solid #6b0000;filter:drop-shadow(0 0 4px rgba(255,0,0,.5))}
.pen-heaven .pen-body{background:linear-gradient(180deg,#ffd700,#b8860b)}
.pen-heaven .pen-tip{border-top:10px solid #8b6914;filter:drop-shadow(0 0 4px rgba(255,215,0,.5))}

.destination-msg{position:absolute;z-index:10;font-family:var(--font-primary);font-size:clamp(16px,3vw,22px);text-align:center;max-width:700px;padding:20px;line-height:1.7;opacity:0;transition:opacity 1s ease;color:rgba(255,255,255,.85)}
.destination-msg.visible{opacity:1}

#session-celebration{overflow:hidden;padding:20px}
#session-celebration::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(255,150,50,.08) 0%,transparent 60%);pointer-events:none;z-index:0}
#confetti-canvas{position:absolute;inset:0;z-index:20;pointer-events:none}
#roses-container{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#balloons-container{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.celebration-content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:20px;--cs:1;transform:scale(var(--cs));}
.celebration-title{font-family:var(--font-primary);font-size:clamp(28px,6vw,52px);font-weight:900;text-align:center;line-height:1.3}
.celebration-subtitle{font-family:var(--font-secondary);font-size:clamp(16px,3vw,24px);color:rgba(255,255,255,.6);font-weight:300;letter-spacing:2px}

.cake-container{position:relative;display:flex;flex-direction:column;align-items:center;margin:10px 0}
.cake-plate{width:240px;height:18px;background:linear-gradient(180deg,#ccc,#999);border-radius:50%;margin-top:-4px;box-shadow:0 4px 15px rgba(0,0,0,.5)}
.cake-shadow{width:200px;height:12px;background:radial-gradient(ellipse,rgba(0,0,0,.35) 0%,transparent 70%);margin-top:8px}
.cake{display:flex;flex-direction:column;align-items:center;position:relative}
.cake-tier{position:relative;border-radius:8px}
.cake-tier-1{width:200px;height:55px;background:linear-gradient(180deg,#e8a0bf,#d4789c);box-shadow:inset 0 -8px 0 rgba(0,0,0,.1)}
.cake-tier-2{width:155px;height:45px;background:linear-gradient(180deg,#f0c0d0,#e8a0bf);margin-top:-6px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.1)}
.cake-tier-3{width:110px;height:38px;background:linear-gradient(180deg,#ffd0e0,#f0c0d0);margin-top:-5px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.1)}
.frosting{position:absolute;top:-7px;left:8%;right:8%;height:14px;background:rgba(255,255,255,.85);border-radius:0 0 40% 40% / 0 0 100% 100%}
.frosting::before,.frosting::after{content:'';position:absolute;top:0;width:18px;height:12px;background:rgba(255,255,255,.85);border-radius:0 0 50% 50%}
.frosting::before{left:-8px}
.frosting::after{right:-8px}
.candle-row{display:flex;align-items:flex-end;gap:10px;position:absolute;top:-48px;left:50%;transform:translateX(-50%)}
.candle{display:flex;flex-direction:column;align-items:center}
.candle-body{width:8px;height:35px;border-radius:3px 3px 0 0;position:relative;background:#fff;}
.candle-wick{width:2px;height:6px;background:#333;border-radius:1px;margin-bottom:2px;}
.flame-wrapper{position:relative;width:16px;height:22px;margin-bottom:-2px}
.flame{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:14px;height:20px;background:radial-gradient(ellipse at 50% 85%,#fff 0%,#ffdd00 20%,#ff8800 50%,#ff4400 75%,transparent 100%);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;animation:flicker .35s infinite alternate;filter:blur(.3px)}
@keyframes flicker{0%{transform:translateX(-50%) scaleY(1) scaleX(1) rotate(-2deg)}100%{transform:translateX(-50%) scaleY(1.12) scaleX(.88) rotate(2deg)}}
.number-candle{width:38px;height:48px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;font-family:var(--font-secondary);color:#fff;position:relative;flex-shrink:0}

.balloon{position:absolute;bottom:-120px;width:38px;height:48px;border-radius:50% 50% 50% 50% / 55% 55% 45% 45%;opacity:.85;animation:floatBalloon linear forwards}
.balloon::before{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:12px;height:8px;background:inherit;filter:brightness(.7);border-radius:50%}
.balloon::after{content:'';position:absolute;bottom:-45px;left:50%;width:1px;height:42px;background:rgba(255,255,255,.25);transform:translateX(-50%)}
@keyframes floatBalloon{0%{transform:translateY(0) rotate(0deg);opacity:.85}50%{opacity:.8}100%{transform:translateY(calc(-100vh - 200px)) rotate(12deg);opacity:0}}

.rose-falling{position:absolute;top:-40px;animation:fallRose linear forwards;z-index:5;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
@keyframes fallRose{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}80%{opacity:.8}100%{transform:translateY(105vh) rotate(540deg) scale(.6);opacity:.2}}

@media(max-width:500px){
  .book-wrapper{--bs:.62}
  .celebration-content{--cs:.7}
  .compare-options{max-width:300px}
  .compare-btn{padding:14px 20px;font-size:14px}
}
@media(min-width:501px) and (max-width:768px){
  .book-wrapper{--bs:.8}
  .celebration-content{--cs:.85}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="session-quotes" class="session active">
  <div id="quote-text" class="quote-text"></div>
</div>

<div id="session-name" class="session">
  <p class="name-question">Hang on, your name is required for some spicy question, what's your name?</p>
  <div class="input-group">
    <input type="text" id="name-input" class="name-input" placeholder="Type your name..." maxlength="30" autocomplete="off">
    <div class="name-error" id="name-error">Please enter your name to continue.</div>
    <button class="btn-continue" id="btn-name-continue">Continue</button>
  </div>
</div>

<div id="session-compare" class="session">
  <p class="compare-question">Which is better?</p>
  <div class="compare-options">
    <button class="compare-btn" data-choice="anusri">Ms. <span class="aurora-name">Anusri</span> Biswas</button>
    <button class="compare-btn" data-choice="else">Anything else</button>
    <button class="compare-btn" data-choice="noanswer">No Answer</button>
  </div>
</div>

<div id="session-book" class="session">
  <canvas id="book-canvas"></canvas>
  <div id="book-scene"></div>
  <div id="destination-msg" class="destination-msg"></div>
</div>

<div id="session-celebration" class="session">
  <div class="warm-overlay"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="celebration-content">
    <h1 class="celebration-title">
      Happy 15th Birthday,<br><span class="aurora-name">Anusri!</span>
    </h1>
    <p class="celebration-subtitle">I wish you a beautiful life with all my heart.</p>

    <div class="cake-container" id="cake-container">
      <div class="cake">
        <div class="candle-row"></div>

        <div class="cake-tier cake-tier-3">
          <div class="frosting"></div>
        </div>
        <div class="cake-tier cake-tier-2"></div>
        <div class="cake-tier cake-tier-1"></div>
        <div class="cake-plate"></div>
        <div class="cake-shadow"></div>
      </div>
    </div>
  </div>
</div>      

<script>

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const delay = ms => new Promise(r => setTimeout(r, ms));
let userName = '';
let isAnimating = false;

window.addEventListener('DOMContentLoaded', () => {
  buildCandles(); 
  playQuotes(); 
});

function switchSession(id, noFade) {
  return new Promise(resolve => {
    const current = $('.session.active');
    if (current) {
      current.classList.add('fade-out');
      setTimeout(() => {
        current.classList.remove('active', 'fade-out');
        const next = $(`#session-${id}`);
        next.classList.add('active');
        requestAnimationFrame(() => requestAnimationFrame(() => resolve()));
      }, noFade ? 0 : 600);
    } else {
      const next = $(`#session-${id}`);
      next.classList.add('active');
      resolve();
    }
  });
}

const quotes = [
  "Happy birthday, Anusri!",
  "Nah, nah, nah!",
  "At first, I thought about doing this, then I remembered...",
  "Who you and I are!",
  "So, fasten your seatbelts, miss Anusri!"
];

async function playQuotes() {
  const el = $('#quote-text');
  for (let i = 0; i < quotes.length; i++) {
    el.textContent = quotes[i];
    el.classList.add('visible');
    await delay(3000);
    el.classList.remove('visible');
    await delay(700);
  }
  await switchSession('name');
  initNameSession();
}

function initNameSession() {
  const input = $('#name-input');
  const btn = $('#btn-name-continue');
  const err = $('#name-error');
  input.focus();

  const submit = () => {
    const val = input.value.trim();
    if (!val) { err.classList.add('show'); input.style.borderColor = 'var(--red)'; return; }
    err.classList.remove('show');
    input.style.borderColor = '';
    userName = val;
    goCompare();
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  input.addEventListener('input', () => { err.classList.remove('show'); input.style.borderColor = ''; });
}

async function goCompare() {
  await switchSession('compare');
  initCompare();
}

function initCompare() {
  $$('.compare-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (isAnimating) return;
      const choice = btn.dataset.choice;
      goBook(choice);
    });
  });
}

async function goBook(choice) {
  isAnimating = true;
  await switchSession('book');
  if (choice === 'noanswer') {
    await playHeavenBook(userName);
  } else {
    const reason = choice === 'anusri'
      ? 'Reason: Dared to compare Anusri. It is unforgivable. Law, Anusri is not a comparable entity.'
      : 'Reason: Comparing and Disrespecting Anusri. There is not a single object comparable to her.';
    await playHellBook(userName, reason);
  }
  isAnimating = false;
}

class BookParticles {
  constructor(canvas, type) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.type = type;
    this.particles = [];
    this.running = false;
  }
  resize() {
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
  }
  createParticle() {
    const w = this.canvas.width, h = this.canvas.height;
    if (this.type === 'hell') {
      return {
        x: Math.random() * w, y: Math.random() * h,
        size: Math.random() * 3.5 + .8,
        vx: (Math.random() - .5) * 1.8, vy: (Math.random() - .5) * 1.8,
        color: Math.random() > .4 ? '#ff0000' : '#8b0000',
        alpha: Math.random() * .7 + .2, life: Math.random() * 200
      };
    } else {
      return {
        x: Math.random() * w, y: Math.random() * h,
        size: Math.random() * 2.5 + .8,
        vy: -(Math.random() * .8 + .3), vx: (Math.random() - .5) * .4,
        color: Math.random() > .35 ? '#ffd700' : '#fffbe6',
        alpha: Math.random() * .7 + .2, life: Math.random() * 200
      };
    }
  }
  start() {
    this.resize();
    this.particles = [];
    const count = this.type === 'hell' ? 120 : 80;
    for (let i = 0; i < count; i++) this.particles.push(this.createParticle());
    this.running = true;
    this.loop();
  }
  stop() { this.running = false; }
  loop() {
    if (!this.running) return;
    const { ctx, canvas, particles, type } = this;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.life++;
      if (type === 'hell') {
        p.vx += (Math.random() - .5) * .08;
        p.vy += (Math.random() - .5) * .08;
        p.vx *= .995; p.vy *= .995;
      }
      if (p.x < -10) p.x = canvas.width + 10;
      if (p.x > canvas.width + 10) p.x = -10;
      if (p.y < -10) p.y = canvas.height + 10;
      if (p.y > canvas.height + 10) p.y = -10;
      const flicker = .5 + .5 * Math.sin(p.life * .04);
      ctx.save();
      ctx.globalAlpha = p.alpha * flicker;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(.5, p.size), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(() => this.loop());
  }
}

const LINE_H = 26;
const CONTENT_TOP = 0;
const CHAR_W = 7.5;

async function writeLine(container, text, pen, speed = 38) {
  const line = document.createElement('div');
  line.className = 'written-line';
  container.appendChild(line);
  pen.style.top = (CONTENT_TOP + container.children.length * LINE_H - LINE_H) + 'px';
  pen.style.left = '35px';
  pen.classList.add('writing');
  for (let i = 0; i < text.length; i++) {
    line.textContent = text.substring(0, i + 1);
    await delay(speed);
  }
  pen.classList.remove('writing');
  await delay(180);
}

async function writeLineWithPause(container, parts, pen, defaultSpeed = 38) {
  const line = document.createElement('div');
  line.className = 'written-line';
  container.appendChild(line);
  pen.style.top = (CONTENT_TOP + container.children.length * LINE_H - LINE_H) + 'px';
  pen.style.left = '35px';
  let full = '';
  for (const part of parts) {
    pen.classList.add('writing');
    for (let i = 0; i < part.text.length; i++) {
      full += part.text[i];
      line.textContent = full;
      await delay(part.speed || defaultSpeed);
    }
    pen.classList.remove('writing');
    if (part.pause) await delay(part.pause);
  }
  await delay(180);
}

function buildPen(type) {
  const pen = document.createElement('div');
  pen.className = `pen pen-${type}`;
  const body = document.createElement('div');
  body.className = 'pen-body';
  const tip = document.createElement('div');
  tip.className = 'pen-tip';
  pen.appendChild(body);
  pen.appendChild(tip);
  pen.style.bottom = '40px';
  pen.style.left = '35px';
  return pen;
}

function wrapText(text, maxChars) {
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for (const w of words) {
    if ((current + ' ' + w).trim().length > maxChars && current) {
      lines.push(current.trim());
      current = w;
    } else {
      current = current ? current + ' ' + w : w;
    }
  }
  if (current.trim()) lines.push(current.trim());
  return lines;
}

let confettiParticles = [];
let celebAnimId = null;

function startCelebration() {
  switchSession('celebration');
  
  const celebrationSection = $('#session-celebration');
  const celebrationCanvas = $('#confetti-canvas');
  document.body.style.overflow = 'hidden';

  resizeCelebrationCanvas(celebrationCanvas);
  startCelebrationEffects(celebrationCanvas);
  spawnBalloons(celebrationSection);
  spawnRoses(celebrationSection);
}

function resizeCelebrationCanvas(canvas) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
}

function startCelebrationEffects(canvas) {
  if (celebAnimId) cancelAnimationFrame(celebAnimId);
  const w = window.innerWidth;
  const h = window.innerHeight;
  confettiParticles = [];

  const colors = ['#e74c3c', '#c0392b', '#2980b9', '#5dade2', '#f39c12', '#e67e22',
      '#f1c40f', '#d4a843', '#e91e63', '#ff6b6b', '#ffd700', '#ff4081'
  ];
  for (let i = 0; i < 200; i++) {
      confettiParticles.push({
          x: Math.random() * w,
          y: Math.random() * h - h,
          w: Math.random() * 8 + 3,
          h: Math.random() * 6 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          vy: Math.random() * 2.5 + 1.5,
          vx: (Math.random() - 0.5) * 2,
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 6,
          opacity: Math.random() * 0.8 + 0.2,
          wobbleAmp: Math.random() * 1.5 + 0.5,
          wobbleSpeed: Math.random() * 0.03 + 0.01,
          wobbleOffset: Math.random() * Math.PI * 2,
      });
  }
  animateCelebration(canvas);
}

function animateCelebration(canvas) {
  const ctx = canvas.getContext('2d');
  const w = window.innerWidth;
  const h = window.innerHeight;

  ctx.clearRect(0, 0, w, h);

  confettiParticles.forEach(p => {
      p.y += p.vy;
      p.x += p.vx + Math.sin(p.wobbleOffset + p.y * p.wobbleSpeed) * p.wobbleAmp;
      p.rotation += p.rotSpeed;

      if (p.y > h + 50) {
          p.y = -50;
          p.x = Math.random() * w;
      }
      if (p.x < -50) p.x = w + 50;
      if (p.x > w + 50) p.x = -50;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
  });

  celebAnimId = requestAnimationFrame(() => animateCelebration(canvas));
}

function spawnBalloons(container) {
  const balloonColors = ['#e74c3c', '#2980b9', '#f39c12', '#e91e63', '#9b59b6', '#1abc9c', '#ff6b6b', '#5dade2', '#f1c40f'];
  for (let i = 0; i < 15; i++) {
      setTimeout(() => {
          const balloon = document.createElement('div');
          balloon.className = 'balloon';
          const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];
          balloon.style.background = `radial-gradient(circle at 30% 25%, ${color} 0%, ${color}dd 60%, ${color}88 100%)`;
          balloon.style.left = (Math.random() * 80 + 10) + '%';
          balloon.style.bottom = '-80px';
          balloon.style.animationDuration = (Math.random() * 6 + 7) + 's';
          balloon.style.width = (Math.random() * 25 + 28) + 'px';
          balloon.style.height = (Math.random() * 30 + 35) + 'px';
          balloon.style.boxShadow = '0 0 15px ' + color + '44';
          container.appendChild(balloon);

          setTimeout(() => {
              if (balloon.parentNode) balloon.parentNode.removeChild(balloon);
          }, 10000);
      }, i * 350);
  }
}
